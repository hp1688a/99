<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Adventure ⚔️🏰 v1.0 Beta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #a8edf0 0%, #fed6e3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    .card {
      background: white;
      padding: 15px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 440px;
      width: 95%;
      position: relative;
      overflow: hidden;
    }

    /* Brand Header Style */
    .brand-header {
      width: 100%;
      margin-bottom: 8px;
      text-align: center;
      font-size: 26px;
      line-height: 1.2;
      color: #0984e3;
      letter-spacing: 0.5px;
    }
    .brand-luya { font-weight: 900; }
    .brand-academy { font-weight: 500; }

    /* Story/Image Containers */
    .story-img-container {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .story-img-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    .story-container { padding: 5px; }

    /* Name Input Group */
    .name-input-group {
      margin: 8px 0 10px 0;
      text-align: left;
    }
    .name-input-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #2d3436;
      margin-bottom: 4px;
    }
    .name-input-group input {
      width: 100%;
      padding: 8px 12px;
      font-size: 15px;
      border: 2px solid #74b9ff;
      border-radius: 10px;
      outline: none;
      font-weight: bold;
      color: #2d3436;
      transition: border-color 0.2s;
    }
    .name-input-group input:focus {
      border-color: #0984e3;
      box-shadow: 0 0 6px rgba(9, 132, 227, 0.2);
    }

    .btn-group-row {
      display: flex;
      gap: 10px;
    }

    .story-btn {
      background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b22222;
      transition: transform 0.1s, box-shadow 0.1s;
      flex: 1;
    }
    .story-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b22222;
    }

    .leaderboard-btn-sub {
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #e1b12c;
      transition: transform 0.1s;
    }
    .leaderboard-btn-sub:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #e1b12c;
    }

    /* Game Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    h1 { color: #ff6b6b; margin: 0; font-size: 18px; }
    .top-action-btn {
      background: #a29bfe;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .top-action-btn:active { transform: scale(0.95); }

    .hero-info-bar {
      background: #eccc68;
      color: #2f3542;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .score-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 8px;
      margin: 6px 0;
      font-size: 13px;
      font-weight: bold;
      color: #444;
      background: #f1f2f6;
      padding: 6px 10px;
      border-radius: 12px;
      text-align: left;
    }
    .score-board span { color: #0984e3; display: inline-block; }
    .score-board .bonus-text { color: #e17055; }

    /* 數字閃爍動畫效果 */
    .num-flash { animation: flashAnim 0.12s ease-out; }
    @keyframes flashAnim {
      0% { transform: scale(1.4); color: #ff3838; opacity: 0.3; }
      50% { transform: scale(1.25); color: #e17055; opacity: 1; }
      100% { transform: scale(1); }
    }

    /* Timer Bar */
    .timer-container {
      width: 100%;
      height: 10px;
      background-color: #dfe6e9;
      border-radius: 6px;
      overflow: hidden;
      margin: 6px 0;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: #00b894;
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* Question Display & Little Demon Style */
    .question-box {
      font-size: 32px;
      font-weight: bold;
      color: #2d3436;
      margin: 6px 0;
      background: #f7f9fc;
      padding: 6px 5px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .question-box span {
      display: inline-block;
      transform: scaleY(1.2);
      transform-origin: center;
    }

    /* 👿 紫色小惡魔樣式與動畫 */
    .demon-box {
      font-size: 28px;
      margin-right: 0px;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
      transform-origin: center;
      color: #8e44ad;
      filter: drop-shadow(0 0 6px rgba(142, 68, 173, 0.6));
    }

    /* 💃 舞蹈動畫 */
    .demon-dancing {
      animation: danceAnim 0.5s infinite alternate ease-in-out;
    }
    @keyframes danceAnim {
      0% { transform: translateY(0) rotate(-10deg) scale(1); }
      100% { transform: translateY(-8px) rotate(10deg) scale(1.05); }
    }

    /* 💥 答對爆炸動畫 */
    .demon-explode {
      animation: explodeAnim 0.4s forwards ease-out;
    }
    @keyframes explodeAnim {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.6) rotate(180deg); filter: brightness(1.8); opacity: 0.9; }
      100% { transform: scale(2.2) rotate(360deg); opacity: 0; }
    }

    /* 😈 答錯搖擺動畫 */
    .demon-laugh {
      animation: laughAnim 0.12s infinite alternate ease-in-out;
    }
    @keyframes laughAnim {
      0% { transform: scale(1) translateY(0) rotate(-6deg); }
      50% { transform: scale(1.1) translateY(-3px) rotate(6deg); }
      100% { transform: scale(1.03) translateY(-1px) rotate(-3deg); }
    }

    .input-display {
      min-width: 44px;
      height: 46px;
      background: #ffffff;
      border: 2px dashed #74b9ff;
      border-radius: 10px;
      color: #0984e3;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      transform: scaleY(1.1);
    }

    /* Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 5px;
    }
    .btn-key {
      background: #74b9ff;
      color: white;
      border: none;
      padding: 6px 0;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0984e3;
      transition: transform 0.1s;
    }
    .btn-key:active { transform: translateY(2px); box-shadow: none; }
    .btn-backspace { background: #ff7675; box-shadow: 0 3px 0 #d63031; font-size: 13px; }
    .btn-submit { background: #00b894; box-shadow: 0 3px 0 #00b894; grid-column: span 3; margin-top: 2px; font-size: 16px; padding: 7px 0; }
    
    .feedback {
      min-height: 48px;
      margin-top: 4px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      line-height: 1.3;
    }
    .correct { color: #00b894; }
    .wrong { color: #d63031; }

    .action-btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .restart-btn {
      padding: 8px 16px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #4834d4;
    }
    .restart-btn:active { transform: translateY(2px); box-shadow: none; }

    .leaderboard-view-btn {
      padding: 8px 16px;
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #e1b12c;
    }
    .leaderboard-view-btn:active { transform: translateY(2px); box-shadow: none; }

    /* 9x9 Review Matrix Table Style */
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 12px 0;
      font-size: 11px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .matrix-table th, .matrix-table td {
      border: 1px solid #dfe6e9;
      padding: 4px 1px;
      text-align: center;
      width: 10%;
    }
    .matrix-table th {
      background: #74b9ff;
      color: white;
      font-weight: bold;
    }
    .matrix-table td.header-col {
      background: #ffeaa7;
      font-weight: bold;
      color: #2d3436;
    }
    .cell-correct { color: #00b894; font-weight: bold; font-size: 12px; }
    .cell-wrong { color: #d63031; font-weight: bold; font-size: 12px; }
    .cell-empty { color: #b2bec3; }

    /* Leaderboard Screen */
    .leaderboard-container { text-align: left; }
    .leaderboard-title {
      font-size: 18px;
      color: #d63031;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 6px 3px;
      text-align: center;
      font-size: 11px;
      border-bottom: 1px solid #dfe6e9;
    }
    .leaderboard-table th {
      background: #ffeaa7;
      color: #2d3436;
    }
    .rank-1 { color: #e1b12c; font-weight: bold; font-size: 14px; }
    .rank-2 { color: #636e72; font-weight: bold; font-size: 13px; }
    .rank-3 { color: #d63031; font-weight: bold; font-size: 13px; }
  </style>
</head>

<!-- 🔥 Firebase SDK & Firestore 初始化 Module -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    getDocs, 
    query, 
    orderBy, 
    limit,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCAsE7j45yh63OKJNhaI5uUy4fOxc27_nk",
    authDomain: "math-game-leaderboard-831f0.firebaseapp.com",
    projectId: "math-game-leaderboard-831f0",
    storageBucket: "math-game-leaderboard-831f0.firebasestorage.app",
    messagingSenderId: "5952882048",
    appId: "1:5952882048:web:169a1782e3abb29319ad65",
    measurementId: "G-ZP6Z3NCPXR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 掛載至全域 window 物件
  window.db = db;
  window.fsMethods = { collection, addDoc, getDocs, query, orderBy, limit, deleteDoc, doc };
</script>

<script>
  const TOTAL_QUESTIONS = 25;
  const POINTS_PER_QUESTION = 4;
  const MAX_ERRORS = 3;
  const TIME_LIMIT_SECONDS = 10; 

  let playerName = "Brave Knight";
  let score = 0;        
  let bonusScore = 0;   
  let qNum = 1;
  let errors = 0;
  let currentInput = "";
  let isAnswered = false;
  let isGameWon = false;

  let timerInterval = null;
  let timeLeft = TIME_LIMIT_SECONDS * 10; 

  let mode = 1; 
  let num1 = 0, num2 = 0, product = 0;
  let questionPool = []; 
  let questionHistory = {}; 
  let previousScreen = 'story-page-1';

  let audioCtx = null;

  /* 初始化並解鎖 AudioContext */
  function initAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 監聽點擊與按鍵
  document.addEventListener('click', initAudioCtx, { once: true });
  document.addEventListener('touchstart', initAudioCtx, { once: true });
  document.addEventListener('keydown', initAudioCtx, { once: true });

  function playBonusTickSound() {
    try {
      initAudioCtx();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.05);

      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) {
      // 忽略靜音硬體限制
    }
  }

  function triggerNumberFlash(elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.classList.remove('num-flash');
    void el.offsetWidth;
    el.classList.add('num-flash');
  }

  function goToStoryPage(page) {
    document.getElementById('story-page-1').style.display = 'none';
    document.getElementById('story-page-2').style.display = 'none';
    document.getElementById('review-screen').style.display = 'none';
    document.getElementById('end-result-screen').style.display = 'none';
    document.getElementById(`story-page-${page}`).style.display = 'block';
  }

  /* 🔥 清空 Firestore 排行榜所有資料 */
  async function clearLeaderboard() {
    if (!confirm("⚠️ 確定要清空全網所有排行榜資料嗎？此操作無法復原！")) {
      return;
    }

    try {
      if (!window.db || !window.fsMethods) {
        alert("資料庫連線失敗，無法進行清空操作。");
        return;
      }

      const { collection, getDocs, deleteDoc, doc } = window.fsMethods;
      const querySnapshot = await getDocs(collection(window.db, "leaderboard"));

      const deletePromises = [];
      querySnapshot.forEach((docSnapshot) => {
        deletePromises.push(deleteDoc(doc(window.db, "leaderboard", docSnapshot.id)));
      });

      await Promise.all(deletePromises);
      alert("⚡ 排行榜已成功清空！");

      document.getElementById('player-name').value = "Brave Knight";
    } catch (e) {
      console.error("清空排行榜失敗：", e);
      alert("清空失敗，請檢查權限設定或網路連線。");
    }
  }

  function startGame() {
    const inputVal = document.getElementById('player-name').value.trim();

    // 檢查管理員指令
    if (inputVal === "administrator") {
      clearLeaderboard();
      return;
    }

    playerName = inputVal !== "" ? inputVal : "Brave Knight";
    document.getElementById('display-hero-name').innerText = playerName;

    document.getElementById('story-page-1').style.display = 'none';
    document.getElementById('story-page-2').style.display = 'none';
    document.getElementById('review-screen').style.display = 'none';
    document.getElementById('end-result-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';

    resetGameData();
    generateQuestion();
  }

  function initQuestionPool() {
    questionPool = [];
    for (let a = 2; a <= 9; a++) {
      for (let b = 1; b <= 9; b++) {
        questionPool.push({ n1: a, n2: b });
      }
    }
    for (let i = questionPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [questionPool[i], questionPool[j]] = [questionPool[j], questionPool[i]];
    }
  }

  function resetGameData() {
    clearInterval(timerInterval);
    score = 0;
    bonusScore = 0;
    qNum = 1;
    errors = 0;
    isGameWon = false;
    questionHistory = {}; 

    initQuestionPool();

    document.getElementById('score').innerText = 0;
    document.getElementById('bonus-score').innerText = 0;
    document.getElementById('current-total-score').innerText = 0;
    updateLivesUI();
    document.getElementById('question-box').style.display = 'flex';
    document.getElementById('keypad').style.display = 'grid';
    document.getElementById('timer-container').style.display = 'block';
    document.getElementById('end-action-btns').style.display = 'none';
  }

  function resetToStory() {
    clearInterval(timerInterval);

    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('leaderboard-screen').style.display = 'none';
    document.getElementById('review-screen').style.display = 'none';
    document.getElementById('end-result-screen').style.display = 'none';
    goToStoryPage(1);
  }

  function generateQuestion() {
    if (qNum > TOTAL_QUESTIONS) {
      showFinalScore(false);
      return;
    }
    isAnswered = false;
    currentInput = "";

    document.getElementById('q-num').innerText = qNum;
    document.getElementById('feedback').innerHTML = '';

    const currentQ = questionPool.pop();
    num1 = currentQ.n1; 
    num2 = currentQ.n2; 
    product = num1 * num2;

    mode = Math.floor(Math.random() * 4) + 1;
    renderQuestionUI();
    startTimer();
  }

  function renderQuestionUI() {
    const box = document.getElementById('question-box');
    const demonHtml = `<span id="demon-box" class="demon-box demon-dancing">👿</span>`;
    
    if (mode === 1) {
      box.innerHTML = `${demonHtml}<span>${num1} × ${num2} =</span><div class="input-display" id="box1">?</div>`;
    } else if (mode === 2) {
      box.innerHTML = `${demonHtml}<div class="input-display" id="box1">?</div><span>× ${num2} = ${product}</span>`;
    } else if (mode === 3) {
      box.innerHTML = `${demonHtml}<span>${num1} ×</span><div class="input-display" id="box1">?</div><span>= ${product}</span>`;
    } else if (mode === 4) {
      box.innerHTML = `${demonHtml}<div class="input-display" id="box1">?</div><span>×</span><div class="input-display" id="box2">?</div><span>= ${product}</span>`;
    }
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = TIME_LIMIT_SECONDS * 10; 
    updateTimerUI();

    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerUI();

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 100);
  }

  function updateTimerUI() {
    const bar = document.getElementById('timer-bar');
    const maxTenths = TIME_LIMIT_SECONDS * 10;
    const percentage = Math.max(0, (timeLeft / maxTenths) * 100);
    bar.style.width = `${percentage}%`;
    
    if (timeLeft <= 20) { 
      bar.style.backgroundColor = '#ff7675';
    } else {
      bar.style.backgroundColor = '#00b894';
    }
  }

  function updateLivesUI() {
    const remaining = MAX_ERRORS - errors;
    let hearts = "";
    for (let i = 0; i < MAX_ERRORS; i++) {
      hearts += i < remaining ? "❤️" : "🖤";
    }
    document.getElementById('lives').innerText = hearts;
  }

  function getMaxInputLength() {
    if (mode === 1) return 2;
    if (mode === 2 || mode === 3) return 1;
    if (mode === 4) return 2;
    return 2;
  }

  function appendNum(digit) {
    if (isAnswered) return;
    const maxLen = getMaxInputLength();
    if (currentInput.length < maxLen) {
      currentInput += digit;
      updateInputDisplay();
    }
  }

  function backspace() {
    if (isAnswered) return;
    currentInput = currentInput.slice(0, -1);
    updateInputDisplay();
  }

  function updateInputDisplay() {
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');

    if (mode === 1 || mode === 2 || mode === 3) {
      if (box1) box1.innerText = currentInput === "" ? "?" : currentInput;
    } else if (mode === 4) {
      if (box1) box1.innerText = currentInput.length >= 1 ? currentInput[0] : "?";
      if (box2) box2.innerText = currentInput.length >= 2 ? currentInput[1] : "?";
    }
  }

  function checkInputCorrect() {
    if (!currentInput) return false;

    if (mode === 1) {
      return parseInt(currentInput, 10) === product;
    } else if (mode === 2) {
      return parseInt(currentInput, 10) === num1;
    } else if (mode === 3) {
      return parseInt(currentInput, 10) === num2;
    } else if (mode === 4) {
      if (currentInput.length < 2) return false;
      const f1 = parseInt(currentInput[0], 10);
      const f2 = parseInt(currentInput[1], 10);
      return (f1 * f2 === product) && (f1 >= 1 && f1 <= 9) && (f2 >= 1 && f2 <= 9);
    }
    return false;
  }

  function processEvaluation(isFromTimeout) {
    if (isAnswered) return;
    isAnswered = true;
    
    clearInterval(timerInterval);

    const feedback = document.getElementById('feedback');
    const isCorrect = checkInputCorrect();
    const demonBox = document.getElementById('demon-box');

    questionHistory[`${num1}x${num2}`] = isCorrect ? 'correct' : 'wrong';

    if (isCorrect) {
      if (demonBox) {
        demonBox.className = 'demon-box demon-explode';
        demonBox.innerText = '💥';
        setTimeout(() => {
          if (demonBox) {
            demonBox.className = 'demon-box';
            demonBox.style.opacity = '1';
            demonBox.innerHTML = '<span style="color:#00b894; font-size: 28px;">✔️</span>';
          }
        }, 380);
      }

      score += POINTS_PER_QUESTION;
      document.getElementById('score').innerText = score;
      document.getElementById('current-total-score').innerText = score + bonusScore;

      feedback.className = 'feedback correct';

      let bonusAddedThisQ = 0;

      if (timeLeft <= 0) {
        feedback.innerHTML = `
          <div>✨ Spell Cast Successfully! (+${POINTS_PER_QUESTION} pts)</div>
          <div style="color:#e17055;">⚡ Time Bonus: +0 pts</div>
        `;
        checkGameProgress(500);
      } else {
        const bonusAnimation = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            bonusAddedThisQ += 1;
            bonusScore += 1;

            playBonusTickSound();

            document.getElementById('bonus-score').innerText = bonusScore;
            document.getElementById('current-total-score').innerText = score + bonusScore;
            
            triggerNumberFlash('bonus-score');
            triggerNumberFlash('feedback-bonus-num');

            updateTimerUI();

            const secLeftStr = (timeLeft / 10).toFixed(1);
            feedback.innerHTML = `
              <div>✨ Spell Cast Successfully! (+${POINTS_PER_QUESTION} pts)</div>
              <div style="color:#e17055;">⚡ Time Bonus: +<span id="feedback-bonus-num" class="num-flash">${bonusAddedThisQ}</span> pts (${secLeftStr}s)</div>
            `;
          } else {
            clearInterval(bonusAnimation);
            checkGameProgress(500);
          }
        }, 25);
      }
    } else {
      if (demonBox) {
        demonBox.className = 'demon-box demon-laugh';
        demonBox.innerHTML = '👿<span style="font-size: 15px; margin: 0 1px; vertical-align: middle; color: #8e44ad; font-weight: bold;">Oops!</span><span style="color:#d63031; font-size: 24px; vertical-align: middle;">❌</span>';
      }

      errors++;
      updateLivesUI();
      feedback.className = 'feedback wrong';

      if (isFromTimeout && currentInput === "") {
        feedback.innerHTML = `
          <div>⏰ Time's Up!</div>
          <div>Answer: ${num1} × ${num2} = ${product}</div>
        `;
      } else {
        feedback.innerHTML = `
          <div>❌ Spell Failed!</div>
          <div>Answer: ${num1} × ${num2} = ${product}</div>
        `;
      }
      checkGameProgress(1250);
    }
  }

  function handleTimeout() {
    processEvaluation(true);
  }

  function submitAnswer() {
    if (isAnswered) return;
    if (currentInput.length < (mode === 4 ? 2 : 1)) return; 
    processEvaluation(false);
  }

  function checkGameProgress(delay = 500) {
    setTimeout(() => {
      if (errors >= MAX_ERRORS) {
        showFinalScore(true);
      } else {
        qNum++;
        generateQuestion();
      }
    }, delay);
  }

  function showFinalScore(isGameOver) {
    clearInterval(timerInterval);
    document.getElementById('question-box').style.display = 'none';
    document.getElementById('keypad').style.display = 'none';
    document.getElementById('timer-container').style.display = 'none';
    document.getElementById('end-action-btns').style.display = 'none';

    const feedback = document.getElementById('feedback');
    isGameWon = !isGameOver;

    const remainingLives = Math.max(0, MAX_ERRORS - errors);
    const hpBonusTarget = isGameOver ? 0 : remainingLives * 100;
    let currentHpBonus = 0;

    const titleHtml = isGameOver 
      ? `<h2 style="color:#d63031; font-size:20px; margin:0 0 6px 0;">🌩️ Quest Failed...</h2>`
      : `<h2 style="color:#00b894; font-size:20px; margin:0 0 6px 0;">🎉 Princess Rescued!</h2>`;
    
    const totalColor = isGameOver ? '#d63031' : '#00b894';

    function renderSummaryBox() {
      const currentTotal = score + bonusScore + currentHpBonus;
      feedback.innerHTML = `
        <div style="padding: 5px 0; width: 100%;">
          ${titleHtml}
          <div style="background:#f8f9fa; border-radius:14px; padding:8px; margin:8px 0; font-size:14px; text-align:center;">
            <p style="margin: 3px 0;">Hero: <b>${playerName}</b></p>
            <p style="margin: 3px 0;">Base Score: <b>${score}</b> / 100 pts</p>
            <p style="margin: 3px 0;">Time Bonus: <b style="color:#e17055;">+${bonusScore}</b> pts</p>
            <p style="margin: 3px 0;">HP Bonus (${remainingLives} ❤️): <b style="color:#6c5ce7;">+<span id="end-hp-bonus" class="num-flash">${currentHpBonus}</span></b> pts</p>
            <hr style="border:none; border-top:1px solid #dfe6e9; margin:4px 0;">
            <p style="margin: 3px 0; font-weight:bold; font-size:18px;">Total Score: <b id="end-total-score" style="color:${totalColor};">${currentTotal}</b> pts</p>
          </div>
        </div>
      `;
    }

    renderSummaryBox();

    if (hpBonusTarget > 0) {
      const hpAnimation = setInterval(() => {
        if (currentHpBonus < hpBonusTarget) {
          currentHpBonus += 10;
          if (currentHpBonus > hpBonusTarget) currentHpBonus = hpBonusTarget;
          
          playBonusTickSound();
          renderSummaryBox();
          triggerNumberFlash('end-hp-bonus');
          triggerNumberFlash('end-total-score');
        } else {
          clearInterval(hpAnimation);
          const finalTotal = score + bonusScore + hpBonusTarget;
          saveScoreToLeaderboard(playerName, finalTotal, score, bonusScore, hpBonusTarget);
          document.getElementById('end-action-btns').style.display = 'flex';
        }
      }, 40);
    } else {
      saveScoreToLeaderboard(playerName, score + bonusScore, score, bonusScore, 0);
      document.getElementById('end-action-btns').style.display = 'flex';
    }
  }

  function renderMatrixTable() {
    const headerRow = document.getElementById('matrix-header');
    const tbody = document.getElementById('matrix-body');
    
    headerRow.innerHTML = '<th>×</th>';
    for (let c = 1; c <= 9; c++) {
      headerRow.innerHTML += `<th>${c}</th>`;
    }

    tbody.innerHTML = '';
    for (let r = 1; r <= 9; r++) {
      let trHtml = `<tr><td class="header-col">${r}</td>`;
      for (let c = 1; c <= 9; c++) {
        const key = `${r}x${c}`;
        const result = questionHistory[key];
        if (result === 'correct') {
          trHtml += `<td class="cell-correct">✔️</td>`;
        } else if (result === 'wrong') {
          trHtml += `<td class="cell-wrong">❌</td>`;
        } else {
          trHtml += `<td class="cell-empty">-</td>`;
        }
      }
      trHtml += '</tr>';
      tbody.innerHTML += trHtml;
    }
  }

  function goToReviewScreen() {
    document.getElementById('game-screen').style.display = 'none';
    renderMatrixTable();
    document.getElementById('review-screen').style.display = 'block';
  }

  function goToEndResultImg() {
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('review-screen').style.display = 'none';
    const endImg = document.getElementById('end-result-img');

    if (isGameWon) {
      endImg.src = "99_win.jpg";
    } else {
      endImg.src = "99_lose.jpg";
    }

    document.getElementById('end-result-screen').style.display = 'block';
  }

  /* 🔥 儲存成績至 Firebase Firestore */
  async function saveScoreToLeaderboard(name, total, base, bonus, hpBonus = 0) {
    const today = new Date();
    const dateStr = `${today.getMonth() + 1}/${today.getDate()} ${String(today.getHours()).padStart(2, '0')}:${String(today.getMinutes()).padStart(2, '0')}`;

    const data = {
      name: name,
      totalScore: total,
      baseScore: base,
      bonusScore: bonus,
      hpBonus: hpBonus,
      date: dateStr,
      createdAt: Date.now()
    };

    try {
      if (window.db && window.fsMethods) {
        const { collection, addDoc } = window.fsMethods;
        await addDoc(collection(window.db, "leaderboard"), data);
        console.log("成績已成功上傳至 Firestore 雲端！");
      } else {
        console.warn("Firestore 未成功初始化");
      }
    } catch (e) {
      console.error("上傳成績失敗：", e);
    }
  }

  /* 🔥 從 Firebase Firestore 載入前 10 名排行榜 */
  async function renderLeaderboard() {
    const tbody = document.getElementById('leaderboard-body');
    tbody.innerHTML = '<tr><td colspan="5" style="padding:15px; color:#666;">載入雲端排行榜中...</td></tr>';

    try {
      if (!window.db || !window.fsMethods) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:red; padding:15px;">資料庫連線失敗，請稍後再試。</td></tr>';
        return;
      }

      const { collection, getDocs, query, orderBy, limit } = window.fsMethods;
      const q = query(collection(window.db, "leaderboard"), orderBy("totalScore", "desc"), limit(10));
      const querySnapshot = await getDocs(q);

      tbody.innerHTML = '';

      if (querySnapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#999; padding:15px 0;">目前還沒有紀錄，快來搶第一名！</td></tr>`;
        return;
      }

      let index = 0;
      querySnapshot.forEach((doc) => {
        const item = doc.data();
        let rankText = index + 1;
        let rankClass = '';
        if (index === 0) { rankText = '🥇 1'; rankClass = 'rank-1'; }
        else if (index === 1) { rankText = '🥈 2'; rankClass = 'rank-2'; }
        else if (index === 2) { rankText = '🥉 3'; rankClass = 'rank-3'; }

        const hpVal = item.hpBonus !== undefined ? item.hpBonus : 0;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="${rankClass}">${rankText}</td>
          <td style="font-weight:bold;">${item.name}</td>
          <td style="color:#d63031; font-weight:bold;">${item.totalScore}</td>
          <td>${item.baseScore} / +${item.bonusScore} / +${hpVal}</td>
          <td style="font-size:10px; color:#636e72;">${item.date}</td>
        `;
        tbody.appendChild(row);
        index++;
      });
    } catch (e) {
      console.error("載入排行榜失敗：", e);
      tbody.innerHTML = '<tr><td colspan="5" style="color:red; padding:15px;">載入排行榜失敗，請稍後再試。</td></tr>';
    }
  }

  function showLeaderboard() {
    clearInterval(timerInterval);
    if (document.getElementById('story-page-1').style.display !== 'none') previousScreen = 'story-page-1';
    else if (document.getElementById('story-page-2').style.display !== 'none') previousScreen = 'story-page-2';
    else if (document.getElementById('game-screen').style.display !== 'none') previousScreen = 'game-screen';
    else if (document.getElementById('review-screen').style.display !== 'none') previousScreen = 'review-screen';
    else if (document.getElementById('end-result-screen').style.display !== 'none') previousScreen = 'end-result-screen';

    document.getElementById('story-page-1').style.display = 'none';
    document.getElementById('story-page-2').style.display = 'none';
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('review-screen').style.display = 'none';
    document.getElementById('end-result-screen').style.display = 'none';

    renderLeaderboard();
    document.getElementById('leaderboard-screen').style.display = 'block';
  }

  function closeLeaderboard() {
    document.getElementById('leaderboard-screen').style.display = 'none';
    document.getElementById(previousScreen).style.display = 'block';

    if (previousScreen === 'game-screen' && !isAnswered && qNum <= TOTAL_QUESTIONS && errors < MAX_ERRORS) {
      startTimer();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (isAnswered || document.getElementById('game-screen').style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') appendNum(e.key);
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Enter') submitAnswer();
  });
</script>
</body>
</html>
