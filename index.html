<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Adventure ⚔️🏰 v1.0 Beta</title>
  <!-- 引入 SheetJS 讀取 Excel 檔案 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #a8edf0 0%, #fed6e3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    .card {
      background: white;
      padding: 15px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 440px;
      width: 95%;
      position: relative;
      overflow: hidden;
    }

    /* Brand Header Style */
    .brand-header {
      width: 100%;
      margin-bottom: 8px;
      text-align: center;
      font-size: 26px;
      line-height: 1.2;
      color: #0984e3;
      letter-spacing: 0.5px;
    }
    .brand-luya { font-weight: 900; }
    .brand-academy { font-weight: 500; }

    /* Name Input Group Style */
    .name-input-group {
      margin: 10px 0 14px 0;
      text-align: center;
    }
    .name-input-group label {
      display: block;
      width: 90%;
      margin: 0 auto 6px auto;
      font-size: 14px;
      font-weight: bold;
      color: #2d3436;
      text-align: left;
    }
    .name-input-group input {
      width: 90%;
      padding: 10px 14px;
      font-size: 15px;
      border: 2px solid #74b9ff;
      border-radius: 12px;
      outline: none;
      font-weight: bold;
      color: #2d3436;
      text-align: left;
      transition: border-color 0.2s;
    }
    .name-input-group input:focus {
      border-color: #0984e3;
      box-shadow: 0 0 6px rgba(9, 132, 227, 0.2);
    }

    /* BGM Toggle Switch Style */
    .bgm-toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #2d3436;
      background: #f1f2f6;
      padding: 8px 10px;
      border-radius: 14px;
      box-shadow: 0 4px 0 #dfe6e9;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #b2bec3;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00b894;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Story/Image Containers */
    .story-img-container {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .story-img-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    .story-container { padding: 5px; }

    .btn-group-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .story-btn {
      background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b22222;
      transition: transform 0.1s, box-shadow 0.1s;
      flex: 1;
    }
    .story-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b22222;
    }

    .leaderboard-btn-sub {
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #e1b12c;
      transition: transform 0.1s;
    }
    .leaderboard-btn-sub:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #e1b12c;
    }

    /* Game Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    h1 { color: #ff6b6b; margin: 0; font-size: 18px; }
    .top-action-btn {
      background: #a29bfe;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .top-action-btn:active { transform: scale(0.95); }

    .hero-info-bar {
      background: #eccc68;
      color: #2f3542;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .score-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 8px;
      margin: 6px 0;
      font-size: 13px;
      font-weight: bold;
      color: #444;
      background: #f1f2f6;
      padding: 6px 10px;
      border-radius: 12px;
      text-align: left;
    }
    .score-board span { color: #0984e3; display: inline-block; }
    .score-board .bonus-text { color: #e17055; }

    /* 數字閃爍動畫效果 */
    .num-flash { animation: flashAnim 0.12s ease-out; }
    @keyframes flashAnim {
      0% { transform: scale(1.4); color: #ff3838; opacity: 0.3; }
      50% { transform: scale(1.25); color: #e17055; opacity: 1; }
      100% { transform: scale(1); }
    }

    /* Timer Bar */
    .timer-container {
      width: 100%;
      height: 10px;
      background-color: #dfe6e9;
      border-radius: 6px;
      overflow: hidden;
      margin: 6px 0;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: #00b894;
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* Question Display & Little Demon Style */
    .question-box {
      font-size: 32px;
      font-weight: bold;
      color: #2d3436;
      margin: 6px 0;
      background: #f7f9fc;
      padding: 6px 5px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .question-box span {
      display: inline-block;
      transform: scaleY(1.2);
      transform-origin: center;
    }

    .demon-box {
      font-size: 28px;
      margin-right: 0px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      transform-origin: center;
      color: #8e44ad;
      filter: drop-shadow(0 0 6px rgba(142, 68, 173, 0.6));
    }

    .demon-dancing {
      animation: danceAnim 0.5s infinite alternate ease-in-out;
    }
    @keyframes danceAnim {
      0% { transform: translateY(0) rotate(-10deg) scale(1); }
      100% { transform: translateY(-8px) rotate(10deg) scale(1.05); }
    }

    .demon-explode {
      animation: explodeAnim 0.4s forwards ease-out;
    }
    @keyframes explodeAnim {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.6) rotate(180deg); filter: brightness(1.8); opacity: 0.9; }
      100% { transform: scale(2.2) rotate(360deg); opacity: 0; }
    }

    .demon-laugh {
      animation: laughAnim 0.12s infinite alternate ease-in-out;
    }
    @keyframes laughAnim {
      0% { transform: scale(1) translateY(0) rotate(-6deg); }
      50% { transform: scale(1.1) translateY(-3px) rotate(6deg); }
      100% { transform: scale(1.03) translateY(-1px) rotate(-3deg); }
    }

    .input-display {
      min-width: 44px;
      height: 46px;
      background: #ffffff;
      border: 2px dashed #74b9ff;
      border-radius: 10px;
      color: #0984e3;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      transform: scaleY(1.1);
    }

    /* Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .btn-key {
      background: #74b9ff;
      color: white;
      border: none;
      padding: 12px 0;
      font-size: 24px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0984e3;
      transition: transform 0.1s;
    }
    .btn-key:active { transform: translateY(2px); box-shadow: none; }
    .btn-backspace { background: #ff7675; box-shadow: 0 4px 0 #d63031; font-size: 14px; }
    .btn-submit { background: #00b894; box-shadow: 0 4px 0 #009475; grid-column: span 3; font-size: 18px; padding: 12px 0; }
    
    .feedback {
      min-height: 48px;
      margin-top: 4px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      line-height: 1.3;
    }
    .correct { color: #00b894; }
    .wrong { color: #d63031; }

    .action-btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .restart-btn {
      padding: 8px 16px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #4834d4;
    }
    .restart-btn:active { transform: translateY(2px); box-shadow: none; }

    .leaderboard-view-btn {
      padding: 8px 16px;
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #e1b12c;
    }
    .leaderboard-view-btn:active { transform: translateY(2px); box-shadow: none; }

    /* 9x9 Review Matrix Table Style */
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 12px 0;
      font-size: 11px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .matrix-table th, .matrix-table td {
      border: 1px solid #dfe6e9;
      padding: 4px 1px;
      text-align: center;
      width: 10%;
    }
    .matrix-table th {
      background: #74b9ff;
      color: white;
      font-weight: bold;
    }
    .matrix-table td.header-col {
      background: #ffeaa7;
      font-weight: bold;
      color: #2d3436;
    }
    .cell-correct { color: #00b894; font-weight: bold; font-size: 12px; }
    .cell-wrong { color: #d63031; font-weight: bold; font-size: 12px; }
    .cell-empty { color: #b2bec3; }

    /* Leaderboard Screen */
    .leaderboard-container { text-align: left; }
    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .leaderboard-title {
      font-size: 18px;
      color: #d63031;
      font-weight: bold;
      margin: 0;
    }
    .clear-board-btn {
      background: #d63031;
      color: white;
      border: none;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 0 #b22222;
    }
    .clear-board-btn:active { transform: translateY(1px); box-shadow: none; }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 6px 3px;
      text-align: center;
      font-size: 11px;
      border-bottom: 1px solid #dfe6e9;
    }
    .leaderboard-table th {
      background: #ffeaa7;
      color: #2d3436;
    }
    .rank-1 { color: #e1b12c; font-weight: bold; font-size: 14px; }
    .rank-2 { color: #636e72; font-weight: bold; font-size: 13px; }
    .rank-3 { color: #d63031; font-weight: bold; font-size: 13px; }

    .highlight-row {
      animation: highlightBlink 0.8s infinite alternate ease-in-out;
      font-weight: bold;
    }
    @keyframes highlightBlink {
      0% { background-color: #ffeaa7; transform: scale(1); }
      100% { background-color: #55efc4; transform: scale(1.02); }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- 📖 Story Page 1 -->
  <div id="story-page-1" class="story-container">
    <div class="brand-header">
      <span class="brand-luya">LUYA</span> <span class="brand-academy">Academy</span>
    </div>

    <div class="story-img-container">
      <img src="99_01.jpg" alt="Intro Screen">
    </div>

    <div class="btn-group-row">
      <button class="story-btn" onclick="goToStoryPage(2)">Next ➔</button>

      <div class="bgm-toggle-container">
        <span>🎵</span>
        <label class="switch">
          <input type="checkbox" id="bgm-toggle" onchange="toggleBgm(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <button class="leaderboard-btn-sub" onclick="showLeaderboard()">🏆 Board</button>
    </div>
  </div>

  <!-- 📖 Story Page 2 (挑戰者姓名輸入頁) -->
  <div id="story-page-2" class="story-container" style="display: none;">
    <div class="brand-header">
      <span class="brand-luya">LUYA</span> <span class="brand-academy">Academy</span>
    </div>
    <div class="story-img-container">
      <img src="99_02.jpg" alt="Second Screen">
    </div>

    <div class="name-input-group">
      <label for="hero-name-input">Hero English Name:</label>
      <input type="text" id="hero-name-input" placeholder="e.g., Peter Pan (Full English Name)" autocomplete="off">
    </div>

    <button class="story-btn" style="width:100%;" onclick="handleChallengeClick()">Start Quest ⚔️</button>
  </div>

  <!-- 🎮 Main Game Screen -->
  <div id="game-screen" style="display: none;">
    <div class="brand-header">
      <span class="brand-luya">LUYA</span> <span class="brand-academy">Academy</span>
    </div>

    <div class="header-bar">
      <h1>Save the Princess ⚔️</h1>
      <div>
        <button class="top-action-btn" onclick="showLeaderboard()">🏆 Board</button>
        <button class="top-action-btn" onclick="resetToStory()">🔄 Reset</button>
      </div>
    </div>

    <div class="hero-info-bar">
      <span>Hero: <span id="display-hero-name">Brave Knight</span></span>
      <span>Progress: <span id="q-num">1</span> / 25</span>
    </div>

    <div class="score-board">
      <div>HP: <span id="lives">❤️❤️❤️</span></div>
      <div>Base Score: <span id="score">0</span></div>
      <div>Time Bonus: <span id="bonus-score" class="bonus-text">0</span></div>
      <div>Total Score: <span id="current-total-score" style="color:#d63031; font-weight:bold;">0</span></div>
    </div>

    <div class="timer-container" id="timer-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="question-box" id="question-box"></div>

    <div class="keypad" id="keypad">
      <button class="btn-key" onclick="appendNum('1')">1</button>
      <button class="btn-key" onclick="appendNum('2')">2</button>
      <button class="btn-key" onclick="appendNum('3')">3</button>
      <button class="btn-key" onclick="appendNum('4')">4</button>
      <button class="btn-key" onclick="appendNum('5')">5</button>
      <button class="btn-key" onclick="appendNum('6')">6</button>
      <button class="btn-key" onclick="appendNum('7')">7</button>
      <button class="btn-key" onclick="appendNum('8')">8</button>
      <button class="btn-key" onclick="appendNum('9')">9</button>
      <button class="btn-key btn-backspace" onclick="backspace()">⌫ Backspace</button>
      <button class="btn-key" onclick="appendNum('0')">0</button>
      <button class="btn-key btn-submit" onclick="submitAnswer()">Submit ↵</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="action-btn-group" id="end-action-btns" style="display:none;">
      <button class="story-btn" id="next-result-btn" onclick="goToReviewScreen()">Next ➔</button>
      <button class="leaderboard-view-btn" onclick="showLeaderboard()">🏆 Leaderboard</button>
    </div>
  </div>

  <!-- 📊 9x9 Review Matrix Screen -->
  <div id="review-screen" class="story-container" style="display: none;">
    <div class="brand-header">
      <span class="brand-luya">LUYA</span> <span class="brand-academy">Academy</span>
    </div>
    <h3 style="margin: 5px 0; color: #2d3436;">📊 Quest Record Grid</h3>
    <div style="font-size: 12px; margin-bottom: 6px; color: #636e72;">
      <span style="color:#00b894; font-weight:bold;">✔️ Correct</span> | 
      <span style="color:#d63031; font-weight:bold;">❌ Wrong</span> | 
      <span style="color:#b2bec3;">- Not Asked</span>
    </div>

    <table class="matrix-table">
      <thead>
        <tr id="matrix-header"></tr>
      </thead>
      <tbody id="matrix-body"></tbody>
    </table>

    <div class="action-btn-group">
      <button class="story-btn" onclick="handleReviewNext()">Next ➔</button>
      <button class="leaderboard-view-btn" onclick="showLeaderboard()">🏆 Leaderboard</button>
    </div>
  </div>

  <!-- 🏆 Leaderboard Screen -->
  <div id="leaderboard-screen" class="leaderboard-container" style="display: none;">
    <div class="leaderboard-header">
      <div class="leaderboard-title">🏆 Hero Hall of Fame</div>
      <button id="admin-clear-btn" class="clear-board-btn" style="display:none;" onclick="clearLeaderboard()">🗑️ Clear All</button>
    </div>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Hero</th>
          <th>Total</th>
          <th>Base / Time / HP</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
      </tbody>
    </table>

    <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center;" id="leaderboard-bottom-btns">
      <button class="story-btn" style="flex:none; padding:8px 16px; font-size:15px;" onclick="closeLeaderboard()">◀ Back</button>
    </div>
  </div>

  <!-- 🎉/👿 End Result Image Screen -->
  <div id="end-result-screen" class="story-container" style="display: none;">
    <div class="brand-header">
      <span class="brand-luya">LUYA</span> <span class="brand-academy">Academy</span>
    </div>

    <div class="story-img-container">
      <img id="end-result-img" src="" alt="Result Screen">
    </div>
    <div class="action-btn-group">
      <button class="restart-btn" onclick="resetToStory()">Play Again 🔄</button>
      <button class="leaderboard-view-btn" onclick="showLeaderboard()">🏆 Leaderboard</button>
    </div>
  </div>

</div>

<script>
  const TOTAL_QUESTIONS = 25;
  const POINTS_PER_QUESTION = 4;
  const MAX_ERRORS = 3;
  const TIME_LIMIT_SECONDS = 10; 

  let userCredentials = []; 
  let matchedUser = null; 
  let playerName = "Brave Knight";
  let isAdmin = false; 
  let score = 0;        
  let bonusScore = 0;   
  let qNum = 1;
  let errors = 0;
  let currentInput = "";
  let isAnswered = false;
  let isGameWon = false;

  let timerInterval = null;
  let timeLeft = TIME_LIMIT_SECONDS * 10; 

  let mode = 1; 
  let num1 = 0, num2 = 0, product = 0;
  let questionPool = []; 
  let questionHistory = {}; 
  let previousScreen = 'story-page-1';

  let currentDocId = null; 
  let isTop10Score = false; 

  let audioCtx = null;
  let bgmAudio = null;
  let isBgmEnabled = false;

  // 讀取 Name.xlsx Excel 檔案資料
  async function loadCredentials() {
    try {
      const response = await fetch('Name.xlsx');
      if (!response.ok) throw new Error("Excel file fetch failed");
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      userCredentials = XLSX.utils.sheet_to_json(worksheet);
      console.log("Excel資料載入成功：", userCredentials);
    } catch (err) {
      console.error("無法讀取 Name.xlsx 檔案：", err);
    }
  }

  // 頁面載入時預先載入 Excel 與播放預設音樂
  window.addEventListener('DOMContentLoaded', () => {
    loadCredentials();
    playBgm('01.mp3');
  });

  // 按下「Start Quest ⚔️」按鈕時：比對英文姓名（忽略大小寫與連續空格），或允許 administrator 進入遊戲
  async function handleChallengeClick() {
    const inputEl = document.getElementById('hero-name-input');
    const nameInput = inputEl.value.trim().replace(/\s+/g, ' ');

    if (!nameInput) return;

    // 特殊檢查：如果直接輸入 administrator
    if (nameInput.toLowerCase() === 'administrator') {
      isAdmin = true;
      playerName = 'administrator';
      document.getElementById('display-hero-name').innerText = playerName;
      startGame();
      return;
    }

    if (userCredentials.length === 0) {
      await loadCredentials();
    }

    // 不區分大小寫比對姓名
    matchedUser = userCredentials.find(row => {
      const acc = String(row['Name'] || row['Account'] || row['Username'] || row['英文姓名'] || row['姓名'] || '').trim().replace(/\s+/g, ' ');
      return acc.toLowerCase() === nameInput.toLowerCase();
    });

    if (!matchedUser) {
      inputEl.value = '';
      inputEl.placeholder = 'Non-LUYA students';
      return;
    }

    // 判斷是否為管理者
    playerName = String(matchedUser['Name'] || matchedUser['Account'] || matchedUser['英文姓名'] || nameInput).trim();
    if (playerName.toLowerCase() === 'administrator') {
      isAdmin = true;
    } else {
      isAdmin = false;
    }

    document.getElementById('display-hero-name').innerText = playerName;
    startGame();
  }

  function toggleBgm(enabled) {
    isBgmEnabled = enabled;
    if (!isBgmEnabled) {
      stopBgm();
    } else {
      if (document.getElementById('story-page-1').style.display !== 'none') {

      } else if (document.getElementById('story-page-2').style.display !== 'none') {

      } else if (document.getElementById('end-result-screen').style.display !== 'none') {
        playBgm(isGameWon ? '04.mp3' : '03.mp3');

  function playBgm(file) {
    stopBgm();
    if (!isBgmEnabled) return;

    bgmAudio = new Audio(file);
    bgmAudio.loop = true;
    bgmAudio.play().catch(e => {
      console.log("Audio autoplay waiting for user interaction:", e);
    });
  }

  function stopBgm() {
    if (bgmAudio) {
      bgmAudio.pause();
      bgmAudio.currentTime = 0;
      bgmAudio = null;
    }
  }

  function initAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playBonusTickSound() {
    try {
      initAudioCtx();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.05);

      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) {}
  }

  function triggerNumberFlash(elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.classList.remove('num-flash');
    void el.offsetWidth;
    el.classList.add('num-flash');
  }

  function startGame() {

  function initQuestionPool() {
    questionPool = [];
    for (let a = 2; a <= 9; a++) {
      for (let b = 1; b <= 9; b++) {
        questionPool.push({ n1: a, n2: b });
      }
    }
    for (let i = questionPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [questionPool[i], questionPool[j]] = [questionPool[j], questionPool[i]];
    }
  }

  function resetGameData() {
    clearInterval(timerInterval);
    score = 0;
    bonusScore = 0;
    qNum = 1;
    errors = 0;
    isGameWon = false;
    questionHistory = {}; 
    currentDocId = null;
    isTop10Score = false;

    initQuestionPool();

    document.getElementById('score').innerText = 0;
    document.getElementById('bonus-score').innerText = 0;
    document.getElementById('current-total-score').innerText = 0;

  function generateQuestion() {
    if (qNum > TOTAL_QUESTIONS) {
      showFinalScore(false);
      return;
    }
    isAnswered = false;
    currentInput = "";

    document.getElementById('q-num').innerText = qNum;
    document.getElementById('feedback').innerHTML = '';

    const currentQ = questionPool.pop();
    num1 = currentQ.n1; 
    num2 = currentQ.n2; 
    product = num1 * num2;

    mode = Math.floor(Math.random() * 4) + 1;
    renderQuestionUI();
    startTimer();
  }

  function renderQuestionUI() {
    const box = document.getElementById('question-box');
    const demonHtml = `<span id="demon-box" class="demon-box demon-dancing">👿</span>`;
    
    if (mode === 1) {
      box.innerHTML = `${demonHtml}<span>${num1} × ${num2} =</span><div class="input-display" id="box1">?</div>`;
    } else if (mode === 2) {
      box.innerHTML = `${demonHtml}<div class="input-display" id="box1">?</div><span>× ${num2} = ${product}</span>`;
    } else if (mode === 3) {
      box.innerHTML = `${demonHtml}<span>${num1} ×</span><div class="input-display" id="box1">?</div><span>= ${product}</span>`;
    } else if (mode === 4) {
      box.innerHTML = `${demonHtml}<div class="input-display" id="box1">?</div><span>×</span><div class="input-display" id="box2">?</div><span>= ${product}</span>`;
    }
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = TIME_LIMIT_SECONDS * 10; 
    updateTimerUI();

    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerUI();

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 100);
  }

  function updateTimerUI() {
    const bar = document.getElementById('timer-bar');
    const maxTenths = TIME_LIMIT_SECONDS * 10;
    const percentage = Math.max(0, (timeLeft / maxTenths) * 100);
    bar.style.width = `${percentage}%`;
    
    if (timeLeft <= 20) { 
      bar.style.backgroundColor = '#ff7675';
    } else {
      bar.style.backgroundColor = '#00b894';
    }
  }

  function updateLivesUI() {
    const remaining = MAX_ERRORS - errors;
    let hearts = "";
    for (let i = 0; i < MAX_ERRORS; i++) {
      hearts += i < remaining ? "❤️" : "🖤";
    }
    document.getElementById('lives').innerText = hearts;
  }

  function getMaxInputLength() {
    if (mode === 1) return 2;
    if (mode === 2 || mode === 3) return 1;
    if (mode === 4) return 2;
    return 2;
  }

  function appendNum(digit) {
    if (isAnswered) return;
    const maxLen = getMaxInputLength();
    if (currentInput.length < maxLen) {
      currentInput += digit;
      updateInputDisplay();
    }
  }

  function backspace() {
    if (isAnswered) return;
    currentInput = currentInput.slice(0, -1);
    updateInputDisplay();
  }

  function updateInputDisplay() {
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');

    if (mode === 1 || mode === 2 || mode === 3) {
      if (box1) box1.innerText = currentInput === "" ? "?" : currentInput;
    } else if (mode === 4) {
      if (box1) box1.innerText = currentInput.length >= 1 ? currentInput[0] : "?";
      if (box2) box2.innerText = currentInput.length >= 2 ? currentInput[1] : "?";
    }
  }

  function checkInputCorrect() {
    if (!currentInput) return false;

    if (mode === 1) {
      return parseInt(currentInput, 10) === product;
    } else if (mode === 2) {
      return parseInt(currentInput, 10) === num1;
    } else if (mode === 3) {
      return parseInt(currentInput, 10) === num2;
    } else if (mode === 4) {
      if (currentInput.length < 2) return false;
      const f1 = parseInt(currentInput[0], 10);
      const f2 = parseInt(currentInput[1], 10);
      return (f1 * f2 === product) && (f1 >= 1 && f1 <= 9) && (f2 >= 1 && f2 <= 9);
    }
    return false;
  }

  function processEvaluation(isFromTimeout) {
    if (isAnswered) return;
    isAnswered = true;
    
    clearInterval(timerInterval);

    const feedback = document.getElementById('feedback');
    const isCorrect = checkInputCorrect();
    const demonBox = document.getElementById('demon-box');

    questionHistory[`${num1}x${num2}`] = isCorrect ? 'correct' : 'wrong';

    if (isCorrect) {
      if (demonBox) {
        demonBox.className = 'demon-box demon-explode';
        demonBox.innerText = '💥';
        setTimeout(() => {
          if (demonBox) {
            demonBox.className = 'demon-box';
            demonBox.style.opacity = '1';
            demonBox.style.filter = 'none';
            demonBox.innerHTML = `
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00b894" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            `;
          }
        }, 380);
      }

      score += POINTS_PER_QUESTION;
      document.getElementById('score').innerText = score;
      document.getElementById('current-total-score').innerText = score + bonusScore;

      feedback.className = 'feedback correct';

      let bonusAddedThisQ = 0;

      if (timeLeft <= 0) {
        feedback.innerHTML = `
          <div>✨ Spell Cast Successfully! (+${POINTS_PER_QUESTION} pts)</div>
          <div style="color:#e17055;">⚡ Time Bonus: +0 pts</div>
        `;
        checkGameProgress(500);
      } else {
        const bonusAnimation = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            bonusAddedThisQ += 1;
            bonusScore += 1;

            playBonusTickSound();

            document.getElementById('bonus-score').innerText = bonusScore;
            document.getElementById('current-total-score').innerText = score + bonusScore;
            
            triggerNumberFlash('bonus-score');
            triggerNumberFlash('feedback-bonus-num');

            updateTimerUI();

            const secLeftStr = (timeLeft / 10).toFixed(1);
            feedback.innerHTML = `
              <div>✨ Spell Cast Successfully! (+${POINTS_PER_QUESTION} pts)</div>
              <div style="color:#e17055;">⚡ Time Bonus: +<span id="feedback-bonus-num" class="num-flash">${bonusAddedThisQ}</span> pts (${secLeftStr}s)</div>
            `;
          } else {
            clearInterval(bonusAnimation);
            checkGameProgress(500);
          }
        }, 25);
      }
    } else {
      if (demonBox) {
        demonBox.className = 'demon-box demon-laugh';
        demonBox.innerHTML = '👿<span style="font-size: 15px; margin: 0 1px; vertical-align: middle; color: #8e44ad; font-weight: bold;">Oops!</span><span style="color:#d63031; font-size: 24px; vertical-align: middle;">❌</span>';
      }

      errors++;
      updateLivesUI();
      feedback.className = 'feedback wrong';

      if (isFromTimeout && currentInput === "") {
        feedback.innerHTML = `
          <div>⏰ Time's Up!</div>
          <div>Answer: ${num1} × ${num2} = ${product}</div>
        `;
      } else {
        feedback.innerHTML = `
          <div>❌ Spell Failed!</div>
          <div>Answer: ${num1} × ${num2} = ${product}</div>
        `;
      }
      checkGameProgress(1250);
    }
  }

  function handleTimeout() {
    processEvaluation(true);
  }

  function submitAnswer() {
    if (isAnswered) return;
    if (currentInput.length < (mode === 4 ? 2 : 1)) return; 
    processEvaluation(false);
  }

  function checkGameProgress(delay = 500) {
    setTimeout(() => {
      if (errors >= MAX_ERRORS) {
        showFinalScore(true);
      } else {
        qNum++;
        generateQuestion();
      }
    }, delay);
  }

  function showFinalScore(isGameOver) {
    clearInterval(timerInterval);
    document.getElementById('question-box').style.display = 'none';
    document.getElementById('keypad').style.display = 'none';
    document.getElementById('timer-container').style.display = 'none';
    document.getElementById('end-action-btns').style.display = 'none';

    const feedback = document.getElementById('feedback');
    isGameWon = !isGameOver;

    const remainingLives = Math.max(0, MAX_ERRORS - errors);
    const hpBonusTarget = isGameOver ? 0 : remainingLives * 100;
    let currentHpBonus = 0;

    const titleHtml = isGameOver 
      ? `<h2 style="color:#d63031; font-size:20px; margin:0 0 6px 0;">🌩️ Quest Failed...</h2>`
      : `<h2 style="color:#00b894; font-size:20px; margin:0 0 6px 0;">🎉 Princess Rescued!</h2>`;
    
    const totalColor = isGameOver ? '#d63031' : '#00b894';

    function renderSummaryBox() {
      const currentTotal = score + bonusScore + currentHpBonus;
      feedback.innerHTML = `
        <div style="padding: 5px 0; width: 100%;">
          ${titleHtml}
          <div style="background:#f8f9fa; border-radius:14px; padding:8px; margin:8px 0; font-size:14px; text-align:center;">
            <p style="margin: 3px 0;">Hero: <b>${playerName}</b></p>
            <p style="margin: 3px 0;">Base Score: <b>${score}</b> / 100 pts</p>
            <p style="margin: 3px 0;">Time Bonus: <b style="color:#e17055;">+${bonusScore}</b> pts</p>
            <p style="margin: 3px 0;">HP Bonus (${remainingLives} ❤️): <b style="color:#6c5ce7;">+<span id="end-hp-bonus" class="num-flash">${currentHpBonus}</span></b> pts</p>
            <hr style="border:none; border-top:1px solid #dfe6e9; margin:4px 0;">
            <p style="margin: 3px 0; font-weight:bold; font-size:18px;">Total Score: <b id="end-total-score" style="color:${totalColor};">${currentTotal}</b> pts</p>
          </div>
        </div>
      `;
    }

    renderSummaryBox();

    if (hpBonusTarget > 0) {
      const hpAnimation = setInterval(() => {
        if (currentHpBonus < hpBonusTarget) {
          currentHpBonus += 10;
          if (currentHpBonus > hpBonusTarget) currentHpBonus = hpBonusTarget;
          
          playBonusTickSound();
          renderSummaryBox();
          triggerNumberFlash('end-hp-bonus');
          triggerNumberFlash('end-total-score');
        } else {
          clearInterval(hpAnimation);
          const finalTotal = score + bonusScore + hpBonusTarget;
          saveScoreToLeaderboard(playerName, finalTotal, score, bonusScore, hpBonusTarget);
        }
      }, 40);
    } else {
      saveScoreToLeaderboard(playerName, score + bonusScore, score, bonusScore, 0);
    }
  }

  function renderMatrixTable() {
    const headerRow = document.getElementById('matrix-header');
    const tbody = document.getElementById('matrix-body');

    for (let c = 1; c <= 9; c++) {

  async function saveScoreToLeaderboard(name, total, base, bonus, hpBonus = 0) {
    const today = new Date();
    const dateStr = `${today.getMonth() + 1}/${today.getDate()} ${String(today.getHours()).padStart(2, '0')}:${String(today.getMinutes()).padStart(2, '0')}`;

    const data = {
      name: name,
      totalScore: total,
      baseScore: base,
      bonusScore: bonus,
      hpBonus: hpBonus,
      date: dateStr,
      createdAt: Date.now()
    };

    try {
      if (window.db && window.fsMethods) {
        const { collection, addDoc, getDocs, query, orderBy, limit } = window.fsMethods;
        
        const q = query(collection(window.db, "leaderboard"), orderBy("totalScore", "desc"), limit(10));
        const snapshot = await getDocs(q);
        
        if (snapshot.empty || snapshot.size < 10) {
          isTop10Score = true;
        } else {
          const docs = snapshot.docs;
          const tenthDoc = docs[docs.length - 1].data();
          if (total > tenthDoc.totalScore) {
            isTop10Score = true;
          }
        }

        const docRef = await addDoc(collection(window.db, "leaderboard"), data);
        currentDocId = docRef.id;
        console.log("成績上傳成功，ID:", currentDocId);
      }
    } catch (e) {
      console.error("上傳成績失敗：", e);
    }

    document.getElementById('end-action-btns').style.display = 'flex';
  }

  async function renderLeaderboard(highlightCurrent = false) {
    const tbody = document.getElementById('leaderboard-body');
    tbody.innerHTML = '<tr><td colspan="5" style="padding:15px; color:#666;">載入雲端排行榜中...</td></tr>';

    try {
      if (!window.db || !window.fsMethods) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:red; padding:15px;">資料庫連線失敗，請稍後再試。</td></tr>';
        return;
      }

      const { collection, getDocs, query, orderBy, limit } = window.fsMethods;
      const q = query(collection(window.db, "leaderboard"), orderBy("totalScore", "desc"), limit(10));
      const querySnapshot = await getDocs(q);

      tbody.innerHTML = '';

      if (querySnapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#999; padding:15px 0;">目前還沒有紀錄，快來搶第一名！</td></tr>`;
        return;
      }

      let index = 0;
      querySnapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const docId = docSnap.id;

        let rankText = index + 1;
        let rankClass = '';
        if (index === 0) { rankText = '🥇 1'; rankClass = 'rank-1'; }
        else if (index === 1) { rankText = '🥈 2'; rankClass = 'rank-2'; }
        else if (index === 2) { rankText = '🥉 3'; rankClass = 'rank-3'; }

        const hpVal = item.hpBonus !== undefined ? item.hpBonus : 0;

        const row = document.createElement('tr');
        
        if (highlightCurrent && currentDocId && docId === currentDocId) {
          row.className = 'highlight-row';
        }

        row.innerHTML = `
          <td class="${rankClass}">${rankText}</td>
          <td style="font-weight:bold;">${item.name}</td>
          <td style="color:#d63031; font-weight:bold;">${item.totalScore}</td>
          <td>${item.baseScore} / +${item.bonusScore} / +${hpVal}</td>
          <td style="font-size:10px; color:#636e72;">${item.date}</td>
        `;
        tbody.appendChild(row);
        index++;
      });
    } catch (e) {
      console.error("載入排行榜失敗：", e);
      tbody.innerHTML = '<tr><td colspan="5" style="color:red; padding:15px;">載入排行榜失敗，請稍後再試。</td></tr>';
    }
  }

  // 管理員專用：清空排行榜
  async function clearLeaderboard() {
    if (!isAdmin) return;
    if (!confirm("確定要清空排行榜上的所有紀錄嗎？此動作無法復原！")) return;

    try {
      const { collection, getDocs, deleteDoc, doc } = window.fsMethods;
      const snapshot = await getDocs(collection(window.db, "leaderboard"));
      const deletePromises = [];
      snapshot.forEach((docSnap) => {
        deletePromises.push(deleteDoc(doc(window.db, "leaderboard", docSnap.id)));
      });
      await Promise.all(deletePromises);
      alert("排行榜已成功清空！");
      renderLeaderboard();
    } catch (e) {
      console.error("清空排行榜失敗：", e);
      alert("清空排行榜失敗，請檢查權限或網路連線。");
    }
  }

  function closeLeaderboard() {
    document.getElementById('leaderboard-screen').style.display = 'none';
    document.getElementById(previousScreen).style.display = 'block';

    if (previousScreen === 'story-page-1') playBgm('01.mp3');
    else if (previousScreen === 'story-page-2') playBgm('02.mp3');
    else if (previousScreen === 'end-result-screen') playBgm(isGameWon ? '04.mp3' : '03.mp3');

    if (previousScreen === 'game-screen' && !isAnswered && qNum <= TOTAL_QUESTIONS && errors < MAX_ERRORS) {
      startTimer();
    }
  }

  document.addEventListener('keydown', (e) => {
    // 若在故事頁 2 輸入框，按下 Enter 觸發挑戰
    if (document.getElementById('story-page-2').style.display !== 'none' && document.activeElement.id === 'hero-name-input' && e.key === 'Enter') {
      handleChallengeClick();
      return;
    }
    if (isAnswered || document.getElementById('game-screen').style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') appendNum(e.key);
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Enter') submitAnswer();
  });
</script>
</body>
</html>
